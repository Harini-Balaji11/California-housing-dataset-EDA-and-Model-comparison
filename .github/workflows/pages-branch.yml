name: Deploy to gh-pages (branch)

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          pip install -r requirements.txt
      - name: Build reports
        run: |
          mkdir -p reports
          python scripts/run_eda.py || echo "EDA failed; continuing"
          python scripts/run_models.py || echo "Models failed; continuing"
          jupyter nbconvert --to html --output-dir reports --output eda_report.html "notebooks/01_eda_california_housing.ipynb" || echo "nbconvert failed; continuing"
          # Create index.html
          if [ -f reports/eda_report.html ]; then
            cp reports/eda_report.html reports/index.html
          else
            echo "<html><body><h1>Reports will appear here after a successful build.</h1></body></html>" > reports/index.html
          fi
          # Disable Jekyll processing to ensure raw assets serve correctly
          touch reports/.nojekyll
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          force_orphan: true

