name: Deploy Reports to GitHub Pages

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          pip install -r requirements.txt
          python -c "import sys; print('Python', sys.version)"
      - name: Generate reports
        run: |
          mkdir -p reports
          # Try to generate assets; do not fail build if generation fails
          python scripts/run_eda.py || echo "run_eda failed; continuing to publish placeholder"
          python scripts/run_models.py || echo "run_models failed; continuing"
          jupyter nbconvert --to html --output-dir reports --output eda_report.html "notebooks/01_eda_california_housing.ipynb" || echo "nbconvert failed; continuing"
          # Ensure an index exists for Pages
          if [ -f reports/eda_report.html ]; then
            cp reports/eda_report.html reports/index.html
          else
            echo "<html><body><h1>Reports will appear here after a successful build.</h1></body></html>" > reports/index.html
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

